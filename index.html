
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ML50 管理システム</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f5f9;
      color: #202938;
      font-family: sans-serif;
    }
    main {
      width: min(90%, 420px);
      padding: 32px 24px;
      box-sizing: border-box;
      background: white;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 20px #00000012;
    }
    h1 { font-size: 24px; }
    p { color: #667085; line-height: 1.7; }
    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: #e8f5ed;
      color: #18713b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>ML50 管理システム</h1>
    <p>画像受付・確認・合成・承認管理</p>
    <span class="status">管理画面準備中</span>
  </main>
</body>
</html>
